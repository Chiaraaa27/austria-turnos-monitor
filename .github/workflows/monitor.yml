
name: Austria WHV appointment monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: python -m playwright install chromium

      - run: python monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Upload diagnostics (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: diagnostics/
          retention-days: 3
